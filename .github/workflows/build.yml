# Tests the core (and the fork, if this repo is one), then builds the fork's image on GitHub
# (not on the NAS) as ghcr.io/<owner>/<repo>:sha-<short>. The core repo has no fork/ folder,
# so it only runs the tests.
name: Test and build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      is_fork: ${{ steps.fork.outputs.is_fork }}
    steps:
      - uses: actions/checkout@v4
      - id: fork
        run: echo "is_fork=$([ -f fork/config.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt pytest
          if [ -f fork/requirements.txt ]; then pip install -r fork/requirements.txt; fi
      - name: Tests
        run: python3 -m pytest -q
      - name: Front-end syntax
        run: |
          node --check adwatch/static/app.js
          if [ -f fork/static/fork.js ]; then node --check fork/static/fork.js; fi

  image:
    needs: test
    if: needs.test.outputs.is_fork == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out tag and base image
        id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          base=$(grep -E '^BASE_IMAGE=' fork/build.env 2>/dev/null | cut -d= -f2- || true)
          echo "base=${base:-python:3.12-slim}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: BASE_IMAGE=${{ steps.meta.outputs.base }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name app -e FETCH=0 -p 8080:8080 ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/api/config | head -c 300; echo
          curl -fs localhost:8080/ | grep -q ADWATCH_CONFIG
          docker logs app
      - run: echo "Built ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
